format = 4
id = "github.com/LiteLDev/LegacyMoney"
version = "0.23.0"

[info]
name = "LegacyMoney"
description = "LLMoney, but adapted to LeviLamina"
tags = ["library", "economy"]

# The default variant holds both builds: the server build for the server side and the client build
# for the client side. There is no "client" variant. The client entry depends on
# github.com/LiteLDev/LeviLamina#client because all LeviLamina releases in range are tooth.json;
# switch it to the bare id once only lip.toml releases of LeviLamina are targeted.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyMoney-server-windows-x64.zip"]
place = [{ src = "LegacyMoney/", dest = "mods/LegacyMoney/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyMoney-client-windows-x64.zip"]
place = [{ src = "LegacyMoney/", dest = "mods/LegacyMoney/" }]
