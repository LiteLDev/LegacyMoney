format = 4
id = "github.com/LiteLDev/LegacyMoney"
version = "0.23.0"

[info]
name = "LegacyMoney"
description = "LLMoney, but adapted to LeviLamina"
tags = ["library", "economy"]

# The default variant holds both builds: the server build for servers (LeviLamina) and the client
# build for clients (LeviLamina#client). The variant "client" is the client build alone, under the
# name earlier releases used for it, so LeviLauncher, existing installs and dependents that ask for
# github.com/LiteLDev/LegacyMoney#client keep working.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyMoney-server-windows-x64.zip"]
place = [{ src = "LegacyMoney/", dest = "mods/LegacyMoney/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyMoney-client-windows-x64.zip"]
place = [{ src = "LegacyMoney/", dest = "mods/LegacyMoney/" }]

[[variants.client]]
side = "client"
platform = "win-x64"

[variants.client.deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants.client.assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyMoney-client-windows-x64.zip"]
place = [{ src = "LegacyMoney/", dest = "mods/LegacyMoney/" }]
